<!DOCTYPE html>  <html lang="tr">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">  
    <meta name="apple-mobile-web-app-capable" content="yes">  
    <meta name="referrer" content="no-referrer">  <title>Hacked By TERA</title>  
<link rel="icon" type="image/png" href="https://i.hizliresim.com/9x1hxd2.png">  
  
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">  

<style>  
    /* ==========================================================================  
       1. TEMEL VE SIFIRLAMA STİLLERİ  
       ========================================================================== */  
    * {  
        margin: 0;  
        padding: 0;  
        box-sizing: border-box;  
    }  

    body, html {  
        height: 100%;  
        background-color: #000000;  
        color: #ffffff;  
        font-family: 'Rajdhani', sans-serif;  
        overflow: hidden;  
        user-select: none;  
        cursor: crosshair;  
    }  

    /* ==========================================================================  
       2. CRT MONİTÖR & SCANLINE EFEKTİ  
       ========================================================================== */  
    .scanlines {  
        position: absolute;  
        top: 0; left: 0; width: 100%; height: 100%;  
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),  
                    linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.04), rgba(0, 255, 0, 0.06));  
        background-size: 100% 3px, 3px 100%;  
        z-index: 10;  
        pointer-events: none;  
        animation: flicker 0.15s infinite;  
    }  

    @keyframes flicker {  
        0% { opacity: 0.95; }  
        50% { opacity: 0.85; }  
        100% { opacity: 0.95; }  
    }  

    /* ==========================================================================  
       3. ARKA PLAN KATMANLARI (NEON KIRMIZI & YEŞİL TEMALI)  
       ========================================================================== */  
    .bg-layer {  
        position: absolute;  
        top: 0; left: 0; width: 100%; height: 100%;  
        background-size: cover;  
        background-position: center;  
        z-index: 1;  
        opacity: 0;  
        transform: scale(1.1);  
        transition: transform 0.1s linear;  
        filter: contrast(1.3) brightness(0.5) sepia(0.3) hue-rotate(-5deg);  
    }  
      
    /* 4K KALİTELİ ARKA PLAN FONLARI */  
    .bg-1 { background-image: url('https://images.pexels.com/photos/1308940/pexels-photo-1308940.jpeg?auto=compress&cs=tinysrgb&w=1600&h=900&dpr=2'); background-position: center 30%; background-size: cover; }  
    .bg-2 { background-image: url('https://images.pexels.com/photos/2387873/pexels-photo-2387873.jpeg?auto=compress&cs=tinysrgb&w=1600&h=900&dpr=2'); background-position: center 20%; background-size: cover; }  
    .bg-3 { background-image: url('https://images.pexels.com/photos/572897/pexels-photo-572897.jpeg?auto=compress&cs=tinysrgb&w=1600&h=900&dpr=2'); background-position: center 50%; background-size: cover; }  
    .bg-4 { background-image: url('https://images.pexels.com/photos/412673/pexels-photo-412673.jpeg?auto=compress&cs=tinysrgb&w=1600&h=900&dpr=2'); background-position: center 40%; background-size: cover; }  
      
    @keyframes fadeBg {  
        0%, 20% { opacity: 0; filter: blur(6px); }  
        25%, 45% { opacity: 0.5; filter: blur(0px); }  
        50%, 100% { opacity: 0; filter: blur(6px); }  
    }  

    #networkCanvas {  
        position: absolute;  
        top: 0; left: 0; width: 100%; height: 100%;  
        z-index: 2;  
    }  

    .vignette-overlay {  
        position: absolute;  
        top: 0; left: 0; width: 100%; height: 100%;  
        background: radial-gradient(circle at center, transparent 10%, #000000 90%);  
        z-index: 3;  
        pointer-events: none;  
        box-shadow: inset 0 0 100px rgba(0,255,102,0.15);  
    }  

    /* ==========================================================================  
       4. ANA DÜZEN  
       ========================================================================== */  
    .container {  
        display: flex;  
        flex-direction: column;  
        align-items: center;  
        justify-content: center;  
        height: 100vh;  
        text-align: center;  
        position: relative;  
        padding: 20px;  
        pointer-events: none;  
        z-index: 5;  
        transition: transform 0.1s linear;  
    }  

    /* ==========================================================================  
       5. HACKED BY YAZISI  
       ========================================================================== */  
    .hacked-title {  
        font-family: 'Orbitron', sans-serif;  
        font-size: 4.5rem;  
        font-weight: 900;  
        text-transform: uppercase;  
        letter-spacing: 8px;  
        color: #ff0033;  
        text-shadow: 0 0 20px rgba(255, 0, 51, 0.8), 0 0 40px rgba(0, 255, 102, 0.6), 4px 4px 0px #003311;  
        animation: titleGlitch 2s infinite ease-in-out;  
        margin-bottom: 25px;  
        background: rgba(0,0,0,0.6);  
        padding: 15px 35px;  
        border-radius: 20px;  
        backdrop-filter: blur(5px);  
        border: 1px solid rgba(0, 255, 102, 0.5);  
        white-space: nowrap;  
    }  

    /* ==========================================================================  
       6. YAZI SLİDER - MESAJLAR  
       ========================================================================== */  
    .slider-container {  
        position: relative;  
        width: 100%;  
        max-width: 1200px;  
        height: 180px;  
        display: flex;  
        justify-content: center;  
        align-items: center;  
        margin-top: 20px;  
    }  

    .slide {  
        position: absolute;  
        opacity: 0;  
        transform: scale(1.2) translateY(25px) skewX(8deg);  
        transition: all 0.7s cubic-bezier(0.23, 1, 0.32, 1);  
        filter: blur(12px);  
        font-family: 'Orbitron', sans-serif;  
        font-size: 2.4rem;  
        color: #fff;  
        text-transform: uppercase;  
        letter-spacing: 4px;  
        pointer-events: none;  
        text-shadow: 3px 3px 0px rgba(255, 0, 51, 0.8), -2px -2px 0px rgba(0, 255, 102, 0.8);  
        background: rgba(0, 0, 0, 0.55);  
        padding: 20px 35px;  
        border-radius: 30px;  
        backdrop-filter: blur(8px);  
        border: 1px solid rgba(0, 255, 102, 0.4);  
        white-space: nowrap;  
    }  

    .slide.active {  
        opacity: 1;  
        transform: scale(1) translateY(0) skewX(0);  
        filter: blur(0);  
        animation: textGlitch 0.4s cubic-bezier(.25, .46, .45, .94) both infinite;  
    }  

    .slide span {  
        color: #00ff66;  
        font-weight: 900;  
        font-size: 3rem;  
        text-shadow: 0 0 45px rgba(0, 255, 102, 1), 0 0 80px rgba(255, 0, 51, 0.7);  
        letter-spacing: 8px;  
        display: inline-block;  
        margin-top: 12px;  
    }  
      
    .turk-motto {  
        font-size: 1.3rem;  
        letter-spacing: 3px;  
        margin-top: 30px;  
        color: #ffffff;  
        font-family: 'Rajdhani', monospace;  
        text-transform: uppercase;  
        background: rgba(0,0,0,0.7);  
        padding: 10px 30px;  
        border-radius: 50px;  
        backdrop-filter: blur(6px);  
        pointer-events: none;  
        font-weight: bold;  
        border-left: 3px solid #ff0033;  
        border-right: 3px solid #00ff66;  
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    }  
      
    .greetz {  
        font-size: 1rem;  
        letter-spacing: 2px;  
        margin-top: 10px;  
        color: #00ff66;  
        font-family: 'Orbitron', monospace;  
        text-transform: uppercase;  
        background: rgba(0,0,0,0.6);  
        padding: 6px 20px;  
        border-radius: 40px;  
        backdrop-filter: blur(4px);  
        pointer-events: none;  
        font-weight: bold;  
        display: inline-block;  
        animation: glowPulse 1.5s ease-in-out infinite;  
    }  
      
    @keyframes glowPulse {  
        0% { text-shadow: 0 0 5px #00ff66; box-shadow: 0 0 5px rgba(0,255,102,0.3); }  
        100% { text-shadow: 0 0 20px #ff0033; box-shadow: 0 0 15px rgba(255,0,51,0.6); }  
    }  

    /* ==========================================================================  
       7. KEYFRAMES  
       ========================================================================== */  
    @keyframes titleGlitch {  
        0%, 100% { transform: skew(0deg); text-shadow: 0 0 20px rgba(255,0,51,0.8), 0 0 40px rgba(0,255,102,0.6), 4px 4px 0px #003311; }  
        95% { transform: skew(0deg); text-shadow: 0 0 20px rgba(255,0,51,0.8), 0 0 40px rgba(0,255,102,0.6), 4px 4px 0px #003311; }  
        96% { transform: skew(3deg); text-shadow: -3px 2px 0px #ff0033, 2px -2px 0px #00ff66; }  
        98% { transform: skew(-2deg); text-shadow: 2px -2px 0px #00ff66, -2px 2px 0px #ff0033; }  
    }  

    @keyframes textGlitch {  
        0% { transform: translate(0); }  
        20% { transform: translate(-2px, 2px); text-shadow: 2px 2px #ff0033, -2px -2px #00ff66; }  
        40% { transform: translate(-2px, -2px); text-shadow: 3px -1px #00ff66, -1px 2px #ff0033; }  
        60% { transform: translate(2px, 2px); text-shadow: -2px 2px #ff0033, 2px -2px #00ff66; }  
        80% { transform: translate(2px, -2px); text-shadow: 2px -2px #00ff66, -2px 2px #ff0033; }  
        100% { transform: translate(0); }  
    }  

    @media (max-width: 880px) {  
        .hacked-title { font-size: 2rem; white-space: normal; padding: 10px 20px; letter-spacing: 4px; }  
        .slide { font-size: 1.2rem; white-space: normal; width: 85%; padding: 12px 15px; }  
        .slide span { font-size: 1.6rem; letter-spacing: 3px; }  
        .slider-container { height: 180px; }  
        .turk-motto { font-size: 0.85rem; }  
        .greetz { font-size: 0.7rem; }  
    }  
      
    @media (max-width: 550px) {  
        .hacked-title { font-size: 1.5rem; }  
        .slide { font-size: 1rem; }  
        .slide span { font-size: 1.3rem; }  
    }  
</style>

</head>  
<body>  <div class="scanlines"></div>  
<div class="bg-layer bg-1"></div>  
<div class="bg-layer bg-2"></div>  
<div class="bg-layer bg-3"></div>  
<div class="bg-layer bg-4"></div>  
  
<canvas id="networkCanvas"></canvas>  
<div class="vignette-overlay"></div>  

<div class="container">  
      
    <!-- HACKED BY YAZISI -->  
    <div class="hacked-title">HACKED BY<br>TERA</div>  
      
    <div class="slider-container">  
        <div class="slide active">SYSTEM STATUS<br><span>HELLO ADMIN! SYSTEM HACKED</span></div>  
        <div class="slide">ADALET<br><span>MÜLKÜN TEMELİDİR</span></div>  
        <div class="slide">TERA OVERRIDE<br><span>SİSTEM DEFTEDİLDİ</span></div>  
    </div>  
    <div class="turk-motto">"Ya İstiklâl Ya Ölüm!"</div>  
    <div class="greetz">✨ GREETZ: TERA TIM ✨</div>  
</div>  

<script>  
    /**  
     * 1. PARALLAX (FARE İLE ARKAPLAN HAREKETİ)  
     */  
    let mouse = { x: null, y: null, radius: 220 };  

    window.addEventListener('mousemove', function(event) {  
        mouse.x = event.clientX;  
        mouse.y = event.clientY;  

        let xAxis = (window.innerWidth / 2 - event.clientX) / 20;  
        let yAxis = (window.innerHeight / 2 - event.clientY) / 20;  

        document.querySelectorAll('.bg-layer').forEach(bg => {  
            bg.style.transform = `scale(1.12) translate(${xAxis}px, ${yAxis}px)`;  
        });  

        document.querySelector('.container').style.transform = `translate(${-xAxis * 0.7}px, ${-yAxis * 0.7}px)`;  
    });  

    window.addEventListener('mouseout', function() {  
        mouse.x = undefined;  
        mouse.y = undefined;  
          
        document.querySelectorAll('.bg-layer').forEach(bg => {  
            bg.style.transform = `scale(1.1) translate(0px, 0px)`;  
        });  
        document.querySelector('.container').style.transform = `translate(0px, 0px)`;  
    });  

    /**  
     * 2. GELİŞMİŞ AĞ ANİMASYONU (NEON KIRMIZI VE YEŞİL TEMA)  
     */  
    const canvas = document.getElementById('networkCanvas');  
    const ctx = canvas.getContext('2d');  
    canvas.width = window.innerWidth;  
    canvas.height = window.innerHeight;  

    let particlesArray = [];  

    class Particle {  
        constructor(x, y, directionX, directionY, size) {  
            this.x = x;  
            this.y = y;  
            this.directionX = directionX;  
            this.directionY = directionY;  
            this.size = size;  
        }  

        draw() {  
            ctx.beginPath();  
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2, false);  
              
            let dx = mouse.x - this.x;  
            let dy = mouse.y - this.y;  
            let distance = Math.sqrt(dx * dx + dy * dy);  

            if (distance < mouse.radius) {  
                ctx.fillStyle = '#00ff66';  
                ctx.shadowBlur = 24;  
                ctx.shadowColor = '#00ff66';  
            } else {  
                ctx.fillStyle = 'rgba(255, 0, 51, 0.85)';  
                ctx.shadowBlur = 7;  
                ctx.shadowColor = '#ff0033';  
            }  
            ctx.fill();  
        }  

        update() {  
            if (this.x > canvas.width || this.x < 0) this.directionX = -this.directionX;  
            if (this.y > canvas.height || this.y < 0) this.directionY = -this.directionY;  
              
            this.x += this.directionX;  
            this.y += this.directionY;  
            this.draw();  
        }  
    }  

    function initCanvas() {  
        particlesArray = [];  
        let numberOfParticles = Math.floor((canvas.height * canvas.width) / 8200);  
          
        if (numberOfParticles > 230) numberOfParticles = 230;  
          
        for (let i = 0; i < numberOfParticles; i++) {  
            let size = (Math.random() * 2.3) + 1.3;  
            let x = (Math.random() * ((innerWidth - size * 2) - (size * 2)) + size * 2);  
            let y = (Math.random() * ((innerHeight - size * 2) - (size * 2)) + size * 2);  
            let directionX = (Math.random() * 1.1) - 0.55;  
            let directionY = (Math.random() * 1.1) - 0.55;  
              
            particlesArray.push(new Particle(x, y, directionX, directionY, size));  
        }  
    }  

    function connectParticles() {  
        for (let a = 0; a < particlesArray.length; a++) {  
            for (let b = a; b < particlesArray.length; b++) {  
                let distance = ((particlesArray[a].x - particlesArray[b].x) * (particlesArray[a].x - particlesArray[b].x))  
                             + ((particlesArray[a].y - particlesArray[b].y) * (particlesArray[a].y - particlesArray[b].y));  
                  
                let maxDist = (canvas.width / 6.2) * (canvas.height / 6.2);  
                if (distance < maxDist) {  
                    let opacityValue = 1 - (distance / 23000);  
                    let dx = mouse.x - particlesArray[a].x;  
                    let dy = mouse.y - particlesArray[a].y;  
                    let mouseDistance = Math.sqrt(dx * dx + dy * dy);  
                      
                    if (mouseDistance < mouse.radius) {  
                        ctx.strokeStyle = 'rgba(0, 255, 102, ' + (opacityValue + 0.25) + ')';  
                        ctx.lineWidth = 2.9;  
                        ctx.shadowBlur = 14;  
                        ctx.shadowColor = '#00ff66';  
                    } else {  
                        ctx.strokeStyle = 'rgba(255, 0, 51, ' + (opacityValue * 0.4) + ')';  
                        ctx.lineWidth = 1.2;  
                        ctx.shadowBlur = 0;  
                    }  
                    ctx.beginPath();  
                    ctx.moveTo(particlesArray[a].x, particlesArray[a].y);  
                    ctx.lineTo(particlesArray[b].x, particlesArray[b].y);  
                    ctx.stroke();  
                }  
            }  
        }  
    }  

    function animateCanvas() {  
        requestAnimationFrame(animateCanvas);  
        ctx.clearRect(0, 0, innerWidth, innerHeight);  
          
        for (let i = 0; i < particlesArray.length; i++) {  
            particlesArray[i].update();  
        }  
        connectParticles();  
    }  

    window.addEventListener('resize', () => {  
        canvas.width = innerWidth;  
        canvas.height = innerHeight;  
        initCanvas();  
    });  

    initCanvas();  
    animateCanvas();  

    /**  
     * 3. SLİDER DÖNGÜSÜ  
     */  
    const slides = document.querySelectorAll('.slide');  
    let currentSlide = 0;  

    function nextSlide() {  
        slides[currentSlide].classList.remove('active');  
        currentSlide = (currentSlide + 1) % slides.length;  
        slides[currentSlide].classList.add('active');  
    }  

    setInterval(nextSlide, 3500);  
</script>  
</body>  
    </html>
